<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Manager</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="mx-auto max-w-100 mt-10">
    <div class="grid grid-cols-2 min-w-100 p-10 gap-5 border border-gray-200 rounded-xl" x-data="{
        tags: [], 
        trf: '',
        contagem: 0
    }">
        <strong>Minhas Tarefas</strong>
        <small class="bg-sky-200 text-center rounded-lg border border-sky-800 cursor-pointer" x-text="contagem+' Pendentes'"></small>
        <input class="border rounded p-1" x-model="trf" placeholder="Nova tarefa">
        <button class="border border-sky-800 rounded p-1 bg-sky-200 hover:bg-sky-800 hover:text-white hover:border-black cursor-pointer" type="button" class="btn btn-primary" @click="
            if (trf) {
                tags.push({ tarefa: trf});
                trf = '';
                contagem += 1
            }
        ">
            Confirmar
        </button>
            <div class="mt-2">
                <template x-for="(tag, index) in tags" :key="index">
                    <span x-data="{entregue : false}" class="badge grid grid-cols-2 justify-between min-w-100 ">
                        <span><input type="checkbox" class="checkbox checkbox-sucess cursor-pointer" @click="entregue = !entregue; if(entregue) { contagem -= 1}; if(!entregue) { contagem += 1}"> <span x-text="tag.tarefa" :class="entregue ? 'line-through text-gray-500' : ''"></span></span>
                        <button class="text-sky-800"
                            type="button"
                            @click="tags.splice(index, 1);
                            if(!entregue) {contagem -= 1}"
                            aria-label="Remover"
                            
                        >
                            ✕
                        </button>
                    </span>
                </template>
            </div>
    </div>
</body>
</html>
